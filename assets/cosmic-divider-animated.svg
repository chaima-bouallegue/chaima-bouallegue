
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="8" viewBox="0 0 1100 8">
  <defs>
    <linearGradient id="cosmic" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="3" rx="1.5" fill="url(#cosmic)"/>

  <rect x="-220" y="0" width="220" height="3" rx="1.5" fill="url(#glow)">
    <animate attributeName="x" from="-220" to="1100" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
